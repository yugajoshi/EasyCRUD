apiVersion: v1
kind: PersistentVolume
metadata:
  name: student-db-volume
spec:
  capacity:
    storage: 8Gi
  volumeMode: Filesystem
  accessModes: 
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: vol-09cd207f153c3fecb
    fsType: ext4
    volumeAttributes: 
      storage.kubernetes.io/csiProvisionerIdentity: static
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: topology.kubernetes.io/zone, operator: In, values: ["ap-south-1b"]}
