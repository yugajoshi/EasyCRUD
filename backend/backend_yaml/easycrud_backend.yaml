apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: my-student-app
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: yugajoshi/student-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "mariadb"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: db_name
            - name: DB_USER
              value: "root"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: password
          resources: 
            requests:
              cpu: 200m
              memory: 100M
            limits:
              cpu: 500m
              memory: 200M
